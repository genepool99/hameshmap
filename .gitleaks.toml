# Extends the built-in gitleaks rules. Scans run in directory mode
# (`gitleaks dir`), so they cover the working tree even with no commits.
[extend]
useDefault = true

[[allowlists]]
description = "Dependency lockfile integrity hashes and vendored browser test deps"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)\.git/''',
]
