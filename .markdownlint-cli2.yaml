---
# Lenient on purpose: catches broken structure, not style preferences.
config:
  default: true
  MD013: false  # line length
  MD024:
    siblings_only: true  # CHANGELOG repeats "Added"/"Fixed" headings
  MD033: false  # inline HTML
  MD036: false  # emphasis used as heading
  MD041: false  # first line heading
  MD060: false  # table column style
ignores:
  - "**/node_modules/**"
  - ".git/**"
  - "LICENSE"
  - "tests/manifest/fixtures/**"
