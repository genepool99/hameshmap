---
name: Live Mesh Map
# Version of this App. The upstream version is set in the Dockerfile.
version: "0.1.0"
slug: live_mesh_map
description: >-
  Live map, monitoring and administration of Meshtastic and MeshCore networks
  (Live Mesh Map World), with Home Assistant sensors through MQTT discovery
url: https://github.com/sauveteur71/live-mesh-map-world
arch:
  - amd64
  - aarch64
stage: experimental

# Without "image:", Home Assistant builds the App from the Dockerfile.
init: true
startup: application
boot: auto
timeout: 30

# ---- Web interface ----------------------------------------------------------
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:map-marker-radius
panel_title: Live Mesh Map
panel_admin: true
watchdog: "http://[HOST]:[PORT:8099]/sante"

# ---- Network ------------------------------------------------------------------
# A port without a host port is bound to loopback inside the container.
ports:
  8095/tcp: null
  4404/tcp: null
ports_description:
  8095/tcp: Direct web access without Home Assistant (optional; the map then relies on its own accounts only)
  4404/tcp: Remote agents (optional; local network or VPN only, never forward from the internet)

# ---- Home Assistant services ----------------------------------------------------
# Broker for the Home Assistant output when ha_mqtt_url is empty.
services:
  - mqtt:want

# ---- Storage --------------------------------------------------------------------
# The App is stopped while /data is backed up.
backup: cold

# ---- Options ----------------------------------------------------------------------
options:
  log_language: en
  meshcore_enabled: true
  ha_mqtt_enabled: true
  ha_mqtt_discovery: true
  ha_mqtt_root_topic: live-mesh-map
  ha_mqtt_lora_send: false
schema:
  map_area: str?
  map_area_name: str?
  radio_frequency_mhz: float(100,3000)?
  log_language: list(en|fr)
  mesh_mqtt_url: str?
  mesh_mqtt_username: str?
  mesh_mqtt_password: password?
  mesh_mqtt_root_topic: str?
  meshcore_enabled: bool
  meshcore_iata: str?
  ha_mqtt_enabled: bool
  ha_mqtt_url: str?
  ha_mqtt_username: str?
  ha_mqtt_password: password?
  ha_mqtt_discovery: bool
  ha_mqtt_root_topic: str
  ha_mqtt_lora_send: bool
  export_token: password?
  setup_code: password?
