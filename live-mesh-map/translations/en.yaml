---
configuration:
  map_area:
    name: Map area
    description: >-
      Area the map covers, as a 1-degree square named after its south-west
      corner, for example MN40W075 for 40-41°N, 75-74°W (MS for southern
      latitudes, E for eastern longitudes). A French department number (43, 2A)
      also works. Leave empty to choose the area in the map's setup wizard.
  map_area_name:
    name: Map area name
    description: Name shown for the area, for example "New Jersey". Optional.
  radio_frequency_mhz:
    name: Radio frequency (MHz)
    description: >-
      Frequency used for coverage computations, for example 869.525 (EU_868),
      906.875 (US LongFast), 919.875 (ANZ). Empty means 869.525.
  log_language:
    name: Log language
    description: Language of the messages in the App log and of the alerts sent by the map. The web interface follows each browser's language.
  mesh_mqtt_url:
    name: Mesh MQTT broker
    description: >-
      Broker the map reads Meshtastic and MeshCore traffic from, for example
      mqtt://core-mosquitto:1883 or mqtts://mqtt.example.org:8883. Do not put
      a user name or password in the address. Leave empty to set the broker
      in the map's setup wizard. This is separate from the Home Assistant
      output below.
  mesh_mqtt_username:
    name: Mesh MQTT user name
    description: User name for the mesh broker. Used only when the broker address above is set.
  mesh_mqtt_password:
    name: Mesh MQTT password
    description: Password for the mesh broker. Used only when the broker address above is set.
  mesh_mqtt_root_topic:
    name: Mesh MQTT root topic
    description: Topic prefix of the Meshtastic region, for example msh/US or msh/EU_868, without a trailing "/#". Empty means msh/EU_868.
  meshcore_enabled:
    name: MeshCore
    description: Show the MeshCore network (map, packet analyser, observers) next to Meshtastic.
  meshcore_iata:
    name: MeshCore area code
    description: Area code used in MeshCore topics (nearest airport, IATA), for example PHL.
  ha_mqtt_enabled:
    name: Home Assistant output
    description: >-
      Publish the state of the network (active nodes, alerts, monitored relays)
      over MQTT for Home Assistant. Without a manual broker below, the MQTT
      service of Home Assistant (for example the Mosquitto broker App) is used
      automatically; if there is none, nothing is published.
  ha_mqtt_url:
    name: Home Assistant output - manual broker
    description: >-
      Optional. Address of another broker to publish to, for example
      mqtt://192.168.1.10:1883. When set, it is used exactly as given and the
      Home Assistant MQTT service is ignored. Do not put a user name or
      password in the address.
  ha_mqtt_username:
    name: Home Assistant output - manual broker user name
    description: Used only with a manual broker.
  ha_mqtt_password:
    name: Home Assistant output - manual broker password
    description: Used only with a manual broker.
  ha_mqtt_discovery:
    name: MQTT discovery
    description: Let Home Assistant create the sensors and monitored relays by itself (MQTT discovery under the "homeassistant" prefix).
  ha_mqtt_root_topic:
    name: Home Assistant output - root topic
    description: Prefix of the published topics. Changing it later creates a new set of entities in Home Assistant.
  ha_mqtt_lora_send:
    name: Allow sending LoRa messages from MQTT
    description: >-
      Off by default. When on, a message published to <root topic>/envoyer is
      transmitted over the radio by the node connected to the map (200 bytes
      at most, one every 20 seconds). Anyone who can publish to the broker can
      then transmit.
  export_token:
    name: Export token
    description: If set, the exports of the map (GeoJSON, GPX, Prometheus metrics, JSON summary) require this token. Other programs can reach them only when direct web access is enabled in the Network section.
  setup_code:
    name: Setup code
    description: >-
      Optional code asked when the first administrator account of the map is
      created. When empty, the map prints a one-time code in the App log.
      Set it before enabling direct web access on a new installation.
network:
  8095/tcp: Direct web access without Home Assistant (optional)
  4404/tcp: Remote agents (optional; local network or VPN only)
