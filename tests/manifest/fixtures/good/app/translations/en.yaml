configuration:
  mqtt_host:
    name: Broker host
    description: Host name of the broker
  mqtt_port:
    name: Broker port
    description: TCP port of the broker
  mqtt_username:
    name: Broker user
    description: User name for the broker
  mqtt_password:
    name: Broker password
    description: Password for the broker
  lora_send:
    name: LoRa transmit
    description: Allow messages to be transmitted
  log_level:
    name: Log level
    description: Verbosity
  extra_brokers:
    name: Extra brokers
    description: Additional brokers
    fields:
      url:
        name: URL
        description: Broker URL
      password:
        name: Password
        description: Broker password
network:
  4404/tcp: Remote agents (disabled by default)
